<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>局域网快传</title>
    <script src="vendor/qrcode.min.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--color-background, #ffffff);
        --fg: var(--color-foreground, #27272a);
        --card: var(--color-card, #ffffff);
        --muted: var(--color-muted, #f4f4f5);
        --muted-fg: var(--color-muted-foreground, #71717a);
        --border: var(--color-border, #e4e4e7);
        --input: var(--color-input, #e4e4e7);
        --primary: var(--color-primary, #2563eb);
        --primary-fg: var(--color-primary-foreground, #ffffff);
        --destructive: var(--color-destructive, #e7000b);
        --success: var(--color-success, #16a34a);
        --warning: var(--color-warning, #d97706);
        --radius: var(--radius-md, 6px);
        --radius-lg: var(--radius-lg, 8px);
        --font: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif);
        --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
        --line: 1px solid var(--border);
      }
      [data-dbx-theme="dark"] {
        --bg: var(--color-background, #18181b);
        --fg: var(--color-foreground, #f4f4f5);
        --card: var(--color-card, #1b1b1f);
        --muted: var(--color-muted, #27272a);
        --muted-fg: var(--color-muted-foreground, #a1a1aa);
        --border: var(--color-border, #3f3f46);
        --input: var(--color-input, #3f3f46);
        --primary: var(--color-primary, #60a5fa);
        --primary-fg: var(--color-primary-foreground, #18181b);
        --destructive: var(--color-destructive, #f3625f);
        --success: var(--color-success, #4ade80);
        --warning: var(--color-warning, #fbbf24);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font-family: var(--font); font-size: 13px; line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      #app { display: flex; flex-direction: column; height: 100%; }
      .spacer { flex: 1; min-width: 0; }

      /* 顶栏 */
      .topbar {
        display: flex; align-items: center; gap: 14px;
        flex: none; height: 44px; padding: 0 16px;
        border-bottom: var(--line); background: var(--card);
      }
      .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; }
      .brand-logo {
        width: 22px; height: 22px; flex-shrink: 0; display: inline-block;
      }
      .status-chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 3px 10px; border-radius: 999px;
        font-size: 11.5px; font-weight: 500;
        background: var(--muted); color: var(--muted-fg);
      }
      .status-chip.running { background: color-mix(in srgb, var(--success) 12%, var(--bg)); color: var(--success); }
      .status-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-fg); }
      .status-chip.running .dot { background: var(--success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 20%, transparent); }

      button {
        cursor: pointer; font: inherit; color: var(--fg);
        background: var(--card); border: 1px solid var(--input);
        border-radius: var(--radius); padding: 0 12px; height: 32px;
        font-size: 12.5px; transition: all .15s;
      }
      button:hover:not(:disabled) { background: var(--muted); }
      [data-dbx-theme="dark"] button:hover:not(:disabled) { background: color-mix(in srgb, var(--muted) 85%, var(--fg) 6%); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      button.primary {
        background: var(--primary); color: var(--primary-fg);
        border-color: transparent; font-weight: 500;
      }
      button.primary:hover:not(:disabled) {
        background: var(--primary); color: var(--primary-fg); filter: brightness(.92);
      }
      button.primary:active:not(:disabled) {
        background: var(--primary); color: var(--primary-fg); filter: brightness(.84);
      }
      button.danger { color: var(--destructive); }
      button.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--destructive) 10%, var(--bg)); }
      button.ghost { background: transparent; border-color: transparent; }
      button.ghost:hover:not(:disabled) { background: var(--muted); }
      [data-dbx-theme="dark"] button.ghost:hover:not(:disabled) { background: color-mix(in srgb, var(--muted) 85%, var(--fg) 6%); }
      button.icon { width: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
      button.pill { border-radius: 999px; height: 26px; padding: 0 10px; font-size: 11.5px; }

      /* Tabs */
      .tabs {
        display: flex; gap: 2px; padding: 0 16px;
        background: var(--card); border-bottom: var(--line);
      }
      .tab {
        padding: 10px 14px; cursor: pointer; font-size: 12.5px;
        color: var(--muted-fg); border-bottom: 2px solid transparent;
        margin-bottom: -1px; font-weight: 500;
      }
      .tab:hover { color: var(--fg); }
      .tab.active { color: var(--fg); border-bottom-color: var(--primary); }

      .tab-panel { display: none; flex: 1; min-height: 0; }
      .tab-panel.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }

      /* 三列布局：频道列表 | 聊天区 | 成员 + 文件 */
      .body { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
      .layout {
        display: grid;
        grid-template-columns: minmax(160px, 240px) minmax(0, 1fr) minmax(160px, 260px);
        flex: 1; min-height: 0; min-width: 0; overflow: hidden;
      }
      .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
      .col.channels { border-right: var(--line); background: var(--card); overflow: hidden; }
      .col.right { border-left: var(--line); background: var(--card); overflow: hidden; }

      .section-title {
        padding: 10px 14px 6px; font-size: 11px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted-fg);
        display: flex; align-items: center; gap: 8px;
      }
      .count {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 18px; height: 18px; padding: 0 6px;
        border-radius: 999px; background: var(--muted); color: var(--muted-fg);
        font-size: 11px; font-variant-numeric: tabular-nums;
      }
      .scroll-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px; }

      /* 频道 / 设备 item */
      .item {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 12px; border-radius: var(--radius); cursor: pointer;
      }
      .item:hover { background: var(--muted); }
      .item.selected { background: color-mix(in srgb, var(--primary) 15%, var(--bg)); }
      .avatar {
        width: 30px; height: 30px; border-radius: 7px; background: var(--muted);
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 600; flex: none; color: var(--fg);
      }
      .item.selected .avatar { background: var(--primary); color: #fff; }
      .meta { flex: 1; min-width: 0; }
      .meta .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .meta .sub { font-family: var(--mono); font-size: 11px; color: var(--muted-fg); }
      .pin-chip {
        font-family: var(--mono); font-size: 11px; font-weight: 600;
        color: var(--fg); background: var(--muted);
        padding: 2px 8px; border-radius: 4px; letter-spacing: 1px;
      }
      .pin-chip.selected { color: var(--primary); }

      .empty-state {
        padding: 40px 20px; text-align: center;
        color: var(--muted-fg); font-size: 12.5px; line-height: 1.6;
      }
      .empty-state .hint {
        display: inline-block; margin-top: 8px; padding: 6px 12px;
        background: var(--muted); border-radius: var(--radius); font-size: 11.5px;
      }

      /* ========== 聊天区 ========== */
      .chat-header {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 14px; border-bottom: var(--line); background: var(--card);
        min-width: 0; overflow: hidden;
      }
      .chat-header h3 { margin: 0; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chat-header .sub { font-size: 11.5px; color: var(--muted-fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .chat-banner {
        padding: 10px 14px; background: color-mix(in srgb, var(--primary) 8%, var(--bg));
        border-bottom: var(--line); font-size: 12px;
        display: flex; align-items: center; gap: 10px; min-width: 0; overflow: hidden;
      }
      .chat-banner span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chat-banner button { height: 24px; padding: 0 10px; font-size: 11.5px; }

      /* 消息气泡列表 */
      .messages {
        flex: 1; min-height: 0; overflow-y: auto;
        padding: 14px; display: flex; flex-direction: column; gap: 10px;
        background: var(--bg);
      }
      .msg {
        display: flex; gap: 10px; max-width: 90%; min-width: 0;
        align-self: flex-start; width: fit-content;
      }
      .msg.me { align-self: flex-end; flex-direction: row-reverse; }
      .msg.system { align-self: center; max-width: 100%; }

      .msg-avatar {
        width: 28px; height: 28px; border-radius: 6px; background: var(--muted);
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 600; flex: none; color: var(--fg);
        flex-shrink: 0;
      }
      .msg.me .msg-avatar { background: var(--primary); color: #fff; }
      .msg.system .msg-avatar { display: none; }

      .msg-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; align-items: flex-start; }
      .msg.me .msg-body { align-items: flex-end; }

      .msg-meta {
        font-size: 10.5px; color: var(--muted-fg);
        display: flex; gap: 6px; align-items: center;
      }
      .msg-bubble {
        padding: 8px 12px; border-radius: 14px;
        background: var(--card); border: var(--line);
        word-wrap: break-word; word-break: break-word; white-space: pre-wrap;
        font-size: 13px; line-height: 1.5;
        min-width: 0; width: fit-content; max-width: 100%;
      }
      .msg.me .msg-bubble {
        background: var(--primary); color: var(--primary-fg); border-color: transparent;
        border-top-right-radius: 4px;
      }
      .msg.system .msg-bubble {
        background: transparent; border: none; padding: 4px 10px;
        color: var(--muted-fg); font-size: 11.5px; font-style: italic;
        text-align: center; max-width: 100%;
      }
      .msg.file .msg-bubble {
        background: var(--muted); color: var(--fg); border: var(--line); padding: 10px 12px;
        display: flex; align-items: center; gap: 10px; white-space: normal;
        max-width: 420px;
      }
      .msg.me .msg-bubble.file-bubble { background: var(--muted); color: var(--fg); border-color: var(--border); }
      .msg.file .msg-bubble .file-icon {
        width: 34px; height: 34px; border-radius: 8px; flex: none;
        background: color-mix(in srgb, var(--primary) 14%, var(--bg)); color: var(--fg);
        font-size: 17px; display: inline-flex; align-items: center; justify-content: center;
      }
      .msg.file .msg-bubble .file-info { flex: 1 1 auto; min-width: 0; font-size: 12px; display: flex; flex-direction: column; gap: 1px; }
      .msg.file .msg-bubble .file-info .fname { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .msg.file .msg-bubble .file-info .fmeta { font-size: 11px; color: var(--muted-fg); }
      .file-actions { display: flex; gap: 6px; flex: none; }
      .file-actions button {
        height: 28px; padding: 0 10px; border-radius: 7px; cursor: pointer;
        border: 1px solid var(--border); background: var(--card); color: var(--fg);
        font-size: 11.5px; white-space: nowrap;
      }
      .file-actions button:hover { background: var(--bg); }

      /* 聊天输入 */
      .chat-input-area {
        flex: none; padding: 10px 12px; border-top: var(--line); background: var(--card);
        display: flex; flex-direction: column; gap: 8px; min-width: 0;
      }
      .chat-input-row { display: flex; gap: 6px; align-items: flex-end; min-width: 0; }
      .chat-input-row textarea {
        flex: 1 1 auto; min-width: 0; min-height: 36px; max-height: 120px; resize: none;
        font: inherit; color: var(--fg); background: var(--muted);
        border: none; border-radius: var(--radius); padding: 8px 10px;
        outline: none; line-height: 1.4;
      }
      .chat-input-row textarea:focus { background: var(--bg); box-shadow: 0 0 0 1px var(--primary) inset; }

      /* emoji 按钮和面板 */
      .chat-input-row .icon-btn {
        width: 36px; height: 36px; border: 1px solid var(--border); background: var(--muted);
        border-radius: var(--radius); cursor: pointer; font-size: 18px; line-height: 1;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        transition: background .15s;
      }
      .chat-input-row .icon-btn:hover { background: var(--bg); }
      .emoji-panel {
        position: absolute; bottom: 64px; left: 12px; z-index: 50;
        background: var(--card); border: var(--line); border-radius: var(--radius);
        padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
        width: 320px;
      }
      .emoji-panel.hidden { display: none; }
      .emoji-categories {
        display: flex; gap: 2px; padding: 0 4px 6px; border-bottom: 1px solid var(--border); margin-bottom: 6px;
      }
      .emoji-cat {
        background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px 6px;
        border-radius: 6px; transition: background .15s;
      }
      .emoji-cat:hover { background: var(--muted); }
      .emoji-cat.active { background: var(--muted); }
      .emoji-grid {
        display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; max-height: 220px; overflow-y: auto;
      }
      .emoji-item {
        background: none; border: none; cursor: pointer; font-size: 20px; padding: 4px;
        border-radius: 6px; line-height: 1; transition: background .1s, transform .1s;
      }
      .emoji-item:hover { background: var(--muted); transform: scale(1.2); }

      .chat-quick-row {
        display: flex; gap: 6px; align-items: center;
      }
      .chat-quick-row label.file-btn {
        display: inline-flex; align-items: center; gap: 4px;
        cursor: pointer; font-size: 11.5px; color: var(--muted-fg);
        padding: 4px 10px; border-radius: 999px; background: var(--muted);
      }
      .chat-quick-row label.file-btn:hover { color: var(--fg); }
      .chat-quick-row input[type="file"] { display: none; }

      /* ========== 右侧：成员 + 文件 ========== */
      .right-panel { padding: 0 12px 12px; }
      .right-panel .member, .right-panel .f-row {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 8px; border-radius: var(--radius);
        font-size: 12px;
      }
      .right-panel .member:hover, .right-panel .f-row:hover { background: var(--muted); }
      .right-panel .member .badge {
        font-size: 10px; padding: 1px 5px; border-radius: 3px;
        background: var(--primary); color: var(--primary-fg); font-weight: 600;
      }
      .right-panel .member.ip { font-family: var(--mono); font-size: 11px; color: var(--muted-fg); }
      .right-panel .f-row .fname { font-family: var(--mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      .right-panel .f-row .fsize { font-size: 10.5px; color: var(--muted-fg); }

      /* ========== Modal ========== */
      .modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
        display: flex; align-items: center; justify-content: center; z-index: 100;
      }
      .modal {
        background: var(--card); border: var(--line); border-radius: var(--radius-lg);
        padding: 24px; width: 460px; max-width: 92vw;
        box-shadow: 0 20px 60px rgba(0,0,0,.3);
      }
      .modal h3 { margin: 0 0 16px; font-size: 14px; font-weight: 600; }
      .modal-body { display: grid; grid-template-columns: 1fr auto; gap: 20px; }
      .modal-col { display: flex; flex-direction: column; gap: 10px; }
      .modal-row-label { font-size: 11px; color: var(--muted-fg); text-transform: uppercase; letter-spacing: .04em; font-weight: 500; }
      .modal-row-value { font-family: var(--mono); font-size: 12px; word-break: break-all; background: var(--muted); padding: 8px; border-radius: var(--radius); }
      .pin-big { font-family: var(--mono); font-size: 24px; font-weight: 700; letter-spacing: 6px; padding: 10px 18px; background: var(--muted); border-radius: var(--radius); text-align: center; }
      .qrcode-box { background: #fff; padding: 10px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; }
      .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: var(--line); }

      /* 新建频道 */
      .create-ch-row { display: flex; gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
      .create-ch-row input[name="ch-name"] {
        flex: 1 1 140px; min-width: 0; padding: 8px 10px; background: var(--muted); border: none; border-radius: var(--radius); font-size: 12px;
      }
      .create-ch-row .pin-wrap { display: flex; gap: 4px; align-items: center; }
      .create-ch-row .pin-wrap input {
        width: 110px; padding: 8px 10px; background: var(--muted); border: none; border-radius: var(--radius); font-family: var(--mono); font-size: 12px; letter-spacing: 2px;
      }
      .create-ch-row .pin-wrap button { padding: 0 8px; height: 34px; font-size: 11px; }

      /* 设置页 */
      .settings-wrap { display: flex; flex: 1; min-height: 0; min-width: 0; justify-content: center; padding: 24px; overflow-y: auto; }
      .settings-card { width: 100%; max-width: 760px; background: var(--card); border: var(--line); border-radius: var(--radius-lg); padding: 22px; display: flex; flex-direction: column; gap: 18px; }
      .settings-card h2 { margin: 0 0 4px; font-size: 16px; }
      .settings-card .desc { margin: 0 0 20px; color: var(--muted-fg); font-size: 12.5px; }
      .running-status-box { padding: 12px 14px; border-radius: var(--radius); background: color-mix(in srgb, var(--success) 8%, var(--bg)); border: 1px solid color-mix(in srgb, var(--success) 20%, transparent); display: flex; align-items: center; gap: 10px; font-size: 12.5px; margin-bottom: 20px; }
      .running-status-box.stopped { background: var(--muted); border-color: var(--border); }
      .running-status-box .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex: none; }
      .running-status-box.stopped .status-dot { background: var(--muted-fg); }
      .running-status-box .info .line1 { font-weight: 600; }
      .running-status-box .info .line2 { font-size: 11.5px; color: var(--muted-fg); margin-top: 2px; }
      .form-grid { display: grid; grid-template-columns: 160px 1fr auto; gap: 10px 16px; align-items: center; }
      .form-grid label { font-size: 12.5px; color: var(--fg); font-weight: 500; }
      .form-grid label .hint { display: block; font-weight: 400; font-size: 11px; color: var(--muted-fg); margin-top: 2px; }
      .form-grid input, .form-grid select { font: inherit; color: var(--fg); background: var(--muted); border: none; border-radius: var(--radius); padding: 8px 10px; outline: none; height: 36px; width: 100%; }
      .form-grid input:focus, .form-grid select:focus { background: var(--bg); border: 1px solid var(--primary); }
      .settings-footer { display: flex; justify-content: flex-end; gap: 10px; padding-top: 18px; margin-top: 18px; border-top: var(--line); }
      .switch { position: relative; width: 36px; height: 20px; flex: none; background: var(--border); border-radius: 999px; cursor: pointer; transition: background .2s; }
      .switch.on { background: var(--primary); }
      .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .2s; }
      .switch.on::after { left: 18px; }
      .switch-wrap { display: flex; align-items: center; gap: 10px; }

      .hidden { display: none !important; }

      /* 设备在线状态点 + ping 标签 */
      .online-dot {
        position: absolute; right: -2px; bottom: -2px;
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--success); border: 2px solid var(--card);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 20%, transparent);
      }
      .ping-tag {
        display: inline-block; font-family: var(--mono); font-size: 10.5px;
        padding: 1px 5px; border-radius: 3px;
        background: color-mix(in srgb, var(--primary) 12%, var(--bg));
        color: var(--primary); font-weight: 600;
      }
      .item .dev-action { opacity: 0; transition: opacity .15s; }
      .item:hover .dev-action { opacity: 1; }

      /* 拖放文件 overlay */
      #dragOverlay {
        position: fixed; inset: 0;
        background: color-mix(in srgb, var(--primary) 10%, transparent);
        backdrop-filter: blur(4px);
        border: 3px dashed var(--primary);
        display: none;
        align-items: center; justify-content: center;
        z-index: 1000;
        pointer-events: none;
      }
      #dragOverlay.active { display: flex; }
      #dragOverlay .drag-inner {
        background: var(--card); border: 1px solid var(--border);
        border-radius: 14px; padding: 28px 48px;
        text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.2);
      }
      #dragOverlay .drag-icon { font-size: 48px; margin-bottom: 8px; }
      #dragOverlay .drag-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
      #dragOverlay .drag-hint { font-size: 12px; color: var(--muted-fg); }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="topbar">
        <div class="brand"><svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="0" y="0" width="64" height="64" rx="14" fill="#0F766E"/>
          <path d="M22 18h10l8 8v20a2 2 0 0 1-2 2H22a2 2 0 0 1-2-2V20a2 2 0 0 1 2-2z" fill="#FFFFFF"/>
          <path d="M32 18v8h8" stroke="#0F766E" stroke-width="2" fill="none" stroke-linejoin="round"/>
          <path d="M26 30h12M26 36h8" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/>
          <circle cx="44" cy="24" r="1.6" fill="#FFFFFF"/>
          <path d="M41 21a4 4 0 0 1 6 0" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M38 18a8 8 0 0 1 12 0" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>局域网快传</div>
        <div class="status-chip" id="statusChip"><span class="dot"></span><span id="statusChipText">未启动</span></div>
        <div class="spacer"></div>
        <div class="quick-actions">
          <button class="pill ghost" id="refreshDevicesBtn">在线设备</button>
          <button class="pill ghost" id="topShareBtn">🖥️ 分享</button>
          <button class="pill danger" id="cfgStopBtn" disabled>停止</button>
          <button class="pill primary" id="cfgStartBtn">启动</button>
        </div>
      </div>

      <!-- Tabs: 聊天 | 设置 -->
      <div class="tabs">
        <div class="tab active" data-tab="chat">频道聊天</div>
        <div class="tab" data-tab="settings">设置</div>
      </div>

      <!-- 聊天页：三列 -->
      <div class="body">
        <div class="tab-panel active" data-panel="chat">
          <div class="layout">
            <!-- 左：频道列表 -->
            <div class="col channels">
              <div class="create-ch-row">
                <input type="text" name="ch-name" id="newChannelName" placeholder="频道名" />
                <div class="pin-wrap">
                  <input type="text" id="newChannelPIN" placeholder="留空自动" maxlength="8" />
                  <button class="ghost" id="randomPINBtn" title="随机 PIN">🎲</button>
                </div>
                <button class="primary" id="createChBtn">创建</button>
              </div>
              <div class="section-title">我的频道 <span class="count" id="chCount">0</span></div>
              <div class="scroll-list" id="channelList">
                <div class="empty-state">
                  还没有频道<br/>
                  <span class="hint">上面输入名字 → 创建</span>
                </div>
              </div>
              <div class="section-title">在线设备 <span class="count" id="devCount">0</span></div>
              <div class="scroll-list" id="deviceList">
                <div class="empty-state" style="padding: 20px 12px;">
                  <span class="hint">"启动"后自动扫描局域网</span>
                </div>

            <!-- 中：聊天区 -->
            <div class="col chat-center" id="chatCenter" style="background: var(--bg);">
              <div class="empty-state" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                左侧创建或选中一个频道开始聊天<br/>
                <span class="hint">公有频道任何人扫码都能加入</span>
              </div>

            <div class="col right" id="rightCol">
              <div class="empty-state" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                选中频道查看成员和文件
              </div>
            </div>

        <!-- 设置页 -->
        <div class="tab-panel" data-panel="settings">
          <div class="settings-wrap">
            <div class="settings-card">
              <h2>局域网快传 · 设置</h2>
              <p class="desc">配置本机服务行为。改完点"保存并应用"会自动重启。</p>
              <div class="running-status-box" id="runningBox">
                <div class="status-dot"></div>
                <div class="info">
                  <div class="line1" id="runningTitle">服务未启动</div>
                  <div class="line2" id="runningSub">启动后才能扫描设备和创建频道</div>
                </div>
              </div>
              <div class="settings-section">
                <div class="section-title" style="padding:0; margin-bottom:10px;">身份</div>
                <div class="form-grid">
                  <label>显示昵称<span class="hint">局域网内其他人看到的名字，可自定义</span></label>
                  <input type="text" id="cfgNickname" placeholder="本机昵称">
                </div>
                <div class="form-grid" style="margin-top: 12px;">
                  <label>唯一 ID<span class="hint">MAC@IP，自动生成。换网卡会变。用来区分不同设备</span></label>
                  <input type="text" id="cfgUniqueId" readonly style="background: var(--muted); font-family: var(--mono); cursor: default;">
                </div>
                <div class="form-grid" style="margin-top: 12px;">
                  <label>MAC 地址<span class="hint">选定网卡的硬件地址</span></label>
                  <input type="text" id="cfgMAC" readonly style="background: var(--muted); font-family: var(--mono); cursor: default;">
                </div>
              </div>
              <div class="settings-section" style="margin-top: 22px;">
                <div class="section-title" style="padding:0; margin-bottom:10px;">网络</div>
                <div class="form-grid">
                  <label>选择网卡<span class="hint">auto = 自动挑一块可用的；或指定名字/IP/序号</span></label>
                  <select id="cfgIf"><option value="auto">auto（自动选择推荐网卡）</option></select>
                  <button class="ghost" id="refreshIfBtn">刷新</button>
                </div>
                <div class="form-grid" style="margin-top: 12px;">
                  <label>监听端口<span class="hint">默认 53317，被占用可改</span></label>
                  <input type="number" id="cfgPort" min="1024" max="65535">
                </div>
              </div>
              <div class="settings-section" style="margin-top: 22px;">
                <div class="section-title" style="padding:0; margin-bottom:10px;">文件接收</div>
                <div class="form-grid">
                  <label>接收目录<span class="hint">对方发给你的文件、频道聊天记录都放这里</span></label>
                  <input type="text" id="cfgSaveDir" placeholder="Documents/LocalSend">
                  <button class="ghost" id="pickFolderBtn">浏览...</button>
                </div>
              </div>
              <div class="settings-section" style="margin-top: 22px;">
                <div class="section-title" style="padding:0; margin-bottom:10px;">启动行为</div>
                <div class="form-grid">
                  <label>自动启动<span class="hint">下次打开工作台时自动拉起服务</span></label>
                  <div class="switch-wrap"><div class="switch" id="cfgAutoStart"></div></div>
                </div>
              </div>
              <div class="settings-footer">
                <button id="cfgSaveOnlyBtn">仅保存配置</button>
                <button class="primary" id="cfgApplyBtn">保存并应用（重启）</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="modalRoot" style="display:none;"></div>

    <!-- 后端文件选择器 -->
    <input type="file" id="filePicker" multiple style="display:none;">
    <input type="file" id="folderPicker" webkitdirectory directory multiple style="display:none;">

    <script>
      const bridge = window.dbxPlugin;
      const state = {
        context: null, running: false, config: null, interfaces: [],
        channels: [], selectedChannel: null, selectedDevice: null, devices: [],
        me: { id: '', name: '', ip: '' },
        transfers: [], // 传输历史
      };
      const $ = sel => document.querySelector(sel);
      // 本机持久身份：优先 localStorage；宿主禁用存储时退化为内存 ID，绝不抛异常
      let _selfId = '';
      function getSelfId() {
        if (_selfId) return _selfId;
        try {
          _selfId = localStorage.getItem('lc_self_id') || '';
          if (!_selfId) {
            _selfId = 'self-' + Math.random().toString(36).slice(2, 10);
            localStorage.setItem('lc_self_id', _selfId);
          }
        } catch (e) {
          if (!_selfId) _selfId = 'self-' + Math.random().toString(36).slice(2, 10);
        }
        return _selfId;
      }
      const invoke = (m, p = {}) => bridge.invoke(m, p, { timeoutMs: 10000 });
      // 传文件/读文件内容（base64）可能较慢，单独放宽超时
      const invokeFile = (m, p = {}) => bridge.invoke(m, p, { timeoutMs: 120000 });
      const humanSize = (b) => !b ? '0 B' :
        b < 1024 ? b + ' B' :
        b < 1024*1024 ? (b/1024).toFixed(1)+' KB' :
        b < 1024*1024*1024 ? (b/1024/1024).toFixed(1)+' MB' :
        (b/1024/1024/1024).toFixed(2)+' GB';
      const fmtTime = (t) => { try { const d = new Date(t); return d.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' }); } catch { return ''; } };

      // ========= 渲染工具 =========
      function setStatusChip(running, info) {
        const chip = $('#statusChip');
        chip.classList.toggle('running', !!running);
        $('#statusChipText').textContent = running ? `运行中 · ${info || ''}` : '未启动';
        $('#cfgStartBtn').disabled = running;
        $('#cfgStopBtn').disabled = !running;
      }
      function toggleSwitch(el, on) { el.classList.toggle('on', !!on); }

      // ========= 设置 =========
      async function refreshInterfaces() {
        try {
          const res = await invoke('localsend/interfaces');
          state.interfaces = res.interfaces || [];
          const sel = $('#cfgIf');
          const recommended = res.recommended;
          sel.innerHTML = '<option value="auto">auto（自动选择推荐网卡）</option>';
          state.interfaces.forEach(i => {
            if (!i.isUp || i.isLoop) return;
            const label = `${i.name}${i.ipv4.length ? '  [' + i.ipv4.join(', ') + ']' : ''}`;
            const opt = document.createElement('option');
            opt.value = i.name; opt.textContent = (i.name === recommended ? '★ ' : '') + label;
            if (i.name === recommended) opt.classList.add('recommended');
            sel.appendChild(opt);
          });
          if (state.config?.networkInterface) sel.value = state.config.networkInterface;
        } catch (e) { console.error(e); }
      }
      function renderConfigUI() {
        const cfg = state.config || {};
        $('#cfgNickname').value = cfg.nickname || '';
        $('#cfgUniqueId').value = cfg.uniqueId || '';
        $('#cfgMAC').value = cfg.mac || '';
        $('#cfgPort').value = cfg.port || 53317;
        $('#cfgSaveDir').value = cfg.saveDir || '';
        toggleSwitch($('#cfgAutoStart'), !!cfg.autoStart);
        if (cfg.networkInterface) $('#cfgIf').value = cfg.networkInterface;
        const box = $('#runningBox'); box.classList.toggle('stopped', !state.running);
        $('#runningTitle').textContent = state.running ? '服务运行中' : '服务未启动';
        $('#runningSub').textContent = state.running
          ? `昵称 ${cfg.nickname||''} · 端口 ${cfg.port} · 网卡 ${cfg.networkInterface||'auto'} · 本机 ${state.localIp||'—'} · MAC ${cfg.mac||'—'}`
          : '保存好配置点右上"启动"';
      }
      async function loadConfig() { try { const r = await invoke('config/get'); state.config = r.config; renderConfigUI(); } catch(e){} }
      async function saveConfigOnly() {
        const patch = {
          nickname: $('#cfgNickname').value.trim(),
          port: parseInt($('#cfgPort').value, 10) || (state.config?.port || 53317),
          saveDir: $('#cfgSaveDir').value.trim() || (state.config?.saveDir || ''),
          networkInterface: $('#cfgIf').value || 'auto',
          autoStart: $('#cfgAutoStart').classList.contains('on'),
        };
        const r = await invoke('config/set', patch);
        if (r.success) state.config = r.config;
        return r;
      }
      async function startService(restart) {
        const applyBtn = $('#cfgApplyBtn'), startBtn = $('#cfgStartBtn');
        const applyText = applyBtn.textContent, startText = startBtn.textContent;
        applyBtn.disabled = true; startBtn.disabled = true;
        if (restart) applyBtn.textContent = '保存并重启中…';
        startBtn.textContent = '启动中…';
        try {
          let saved;
          try { saved = await saveConfigOnly(); } catch (e) { alert('保存配置失败：' + (e?.message || e)); return; }
          if (!saved.success) { alert('保存配置失败：' + (saved.message || '未知错误')); return; }
          try {
            const r = await invoke(restart ? 'config/restart' : 'config/start');
            if (r && r.success === false) {
              showToast(r.message || '启动失败');
              alert('启动失败：' + (r.message || '未知错误'));
            } else {
              showToast(restart ? '配置已保存，服务已重启' : '服务已启动');
            }
          } catch (e) {
            alert('启动失败：' + (e?.message || e));
          }
          await refreshStatus(); await refreshDevices(); await refreshChannels();
        } finally {
          applyBtn.disabled = false; startBtn.disabled = false;
          applyBtn.textContent = applyText; startBtn.textContent = startText;
        }
      }
      async function stopService() { await invoke('config/stop'); await refreshStatus(); }
      async function refreshStatus() {
        const r = await invoke('config/status');
        state.running = r.running; state.config = r.config; state.localIp = r.localIp;
        // 配置已加载：同步本机身份（用于判定"我发出的消息"显示在右侧）
        state.me.id = getSelfId();
        state.me.name = r.config?.nickname || '';
        renderConfigUI(); setStatusChip(r.running, r.running ? `${r.localIp||''}:${r.config.port}` : '');
      }

      // ========= 频道 =========
      async function refreshChannels() {
        try {
          const r = await invoke('channel/list');
          state.channels = r.channels || [];
          // 关键：同步更新 selectedChannel 引用 → 让发送后能看到最新 messages
          if (state.selectedChannel) {
            state.selectedChannel = state.channels.find(c => c.id === state.selectedChannel.id) || null;
          }
          $('#chCount').textContent = state.channels.length;
          const list = $('#channelList');
          if (!state.channels.length) {
            list.innerHTML = `<div class="empty-state" style="padding:16px 10px;">还没有频道<br/><span class="hint">上面输入名字 → 创建</span></div>`;
            renderChatCenter(); renderRightCol(); return;
          }
          list.innerHTML = '';
          state.channels.forEach(ch => {
            const item = document.createElement('div');
            item.className = 'item' + (state.selectedChannel?.id === ch.id ? ' selected' : '');
            const unread = 0; // TODO: 未读计数
            item.innerHTML = `
              <div class="avatar">#</div>
              <div class="meta">
                <div class="name">${ch.name}</div>
                <div class="sub">${ch.members.length} 成员 · ${ch.files.length} 文件</div>
              </div>
              <div class="pin-chip ${state.selectedChannel?.id === ch.id ? 'selected' : ''}">${ch.pin}</div>`;
            item.addEventListener('click', () => {
              state.selectedChannel = ch; refreshChannels(); renderChatCenter(); renderRightCol();
            });
            list.appendChild(item);
          });
        } catch (e) { console.error(e); }
      }
      async function createChannel() {
        const name = $('#newChannelName').value.trim() || '私有频道';
        const pin = $('#newChannelPIN').value.trim();
        try {
          const res = await invoke('channel/create', { name, pin });
          if (!res.id) { alert('创建失败: ' + (res.message||'')); return; }
          state.selectedChannel = res; $('#newChannelName').value = ''; $('#newChannelPIN').value = '';
          await refreshChannels(); renderChatCenter(); renderRightCol();
        } catch (e) { alert('创建失败: ' + (e.message||e)); }
      }
      async function deleteChannel() {
        const ch = state.selectedChannel;
        if (!ch) return;
        if (ch.name === '公有频道' || ch.name === '大厅') { alert('默认公有频道不能删除'); return; }
        if (!confirm(`确认删除频道 "${ch.name}"？所有成员会被移除，聊天记录和文件一并删除。`)) return;
        await invoke('channel/delete', { id: ch.id });
        state.selectedChannel = null;
        await refreshChannels(); renderChatCenter(); renderRightCol();
      }

      // ========= 设备（实时发现 + 点对点操作）=========
      // bridge 事件监听（后端 emitter 推送 peer/device-* 事件）
      function bindEmitterEvents() {
        if (!bridge || !bridge.on) {
          console.warn('[localsend] bridge.on 不可用，设备事件走轮询');
          // 降级：每 5 秒自动刷新设备
          setInterval(() => { if (state.running) refreshDevices(true); }, 5000);
          return;
        }
        bridge.on('peer/device-found', (ev) => {
          const d = ev?.device || ev;
          if (!d || !d.fingerprint) return;
          const idx = state.devices.findIndex(x => x.fingerprint === d.fingerprint);
          if (idx < 0) state.devices.push(d); else state.devices[idx] = { ...state.devices[idx], ...d };
          renderDeviceList();
        });
        bridge.on('peer/device-update', (ev) => {
          const d = ev?.device || ev;
          if (!d || !d.fingerprint) return;
          const idx = state.devices.findIndex(x => x.fingerprint === d.fingerprint);
          if (idx >= 0) { state.devices[idx] = { ...state.devices[idx], ...d }; renderDeviceList(); }
        });
        bridge.on('peer/device-lost', (ev) => {
          const fp = ev?.fingerprint || ev;
          if (!fp) return;
          state.devices = state.devices.filter(x => x.fingerprint !== fp);
          if (state.selectedDevice?.fingerprint === fp) state.selectedDevice = null;
          renderDeviceList();
        });
        // 传输记录实时更新
        bridge.on('peer/transfer-sent', async () => { await refreshTransfers(); renderRightCol(); });
        bridge.on('peer/transfer-received', async () => { await refreshTransfers(); renderRightCol(); });
      }

      async function refreshTransfers() {
        if (!state.running) return;
        try {
          const r = await invoke('localsend/transfers');
          state.transfers = r.transfers || [];
        } catch (e) { /* 忽略 */ }
      }

      // 渲染设备列表（独立函数，支持实时调用）
      function renderDeviceList() {
        $('#devCount').textContent = state.devices.length;
        const list = $('#deviceList');
        if (!state.devices.length) {
          list.innerHTML = `<div class="empty-state" style="padding:16px 10px;">
            ${state.running ? '暂无在线设备<br/><span class="hint">局域网内还没有其他节点启动快传</span>' : '启动服务后自动扫描'}
          </div>`;
          return;
        }
        list.innerHTML = '';
        state.devices.forEach(d => {
          const isSel = state.selectedDevice?.fingerprint === d.fingerprint;
          const item = document.createElement('div');
          item.className = 'item' + (isSel ? ' selected' : '');
          const pingHtml = d.pingMs != null ? `<span class="ping-tag">${d.pingMs}ms</span>` : '';
          item.innerHTML = `
            <div class="avatar" style="position:relative;">
              ${(d.name||'?').slice(0,1).toUpperCase()}
              <span class="online-dot" title="在线"></span>
            </div>
            <div class="meta">
              <div class="name">${escapeHtml(d.name || 'Unknown')}</div>
              <div class="sub">${d.ip}:${d.port} ${pingHtml}</div>
            </div>
            <button class="icon ghost dev-action" data-act="file" title="点对点发文件">📤</button>
            <button class="icon ghost dev-action" data-act="ping" title="测延迟">📡</button>`;
          item.addEventListener('click', (e) => {
            if (e.target.closest('.dev-action')) return;
            state.selectedDevice = d;
            if (state.selectedChannel) {
              joinMemberFromDevice(d);
            } else {
              renderDeviceActions(d);
            }
            renderDeviceList();
          });
          item.querySelectorAll('.dev-action').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              e.stopPropagation();
              const act = btn.dataset.act;
              if (act === 'ping') await pingDevice(d);
              else if (act === 'file') openPeerSendFile(d);
            });
          });
          list.appendChild(item);
        });
      }

      // 选中设备后的快捷操作提示
      function renderDeviceActions(d) {
        const list = $('#deviceList');
        let hint = list.querySelector('.device-hint-row');
        if (!hint) {
          hint = document.createElement('div');
          hint.className = 'device-hint-row';
          hint.style.cssText = 'padding:8px 12px; font-size:11.5px; color:var(--muted-fg); background:var(--muted); border-radius:var(--radius); margin:4px 8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;';
          list.insertBefore(hint, list.firstChild);
        }
        hint.innerHTML = `
          <b style="color:var(--fg);">已选 ${escapeHtml(d.name)}</b> ${d.ip}:${d.port}
          <button class="pill" id="hintJoinBtn">加入频道</button>
          <button class="pill" id="hintPingBtn">测延迟</button>
          <button class="pill" id="hintFileBtn">发文件</button>`;
        hint.querySelector('#hintJoinBtn').onclick = () => {
          alert('请先创建或选中一个频道，然后点设备即可加入该频道');
        };
        hint.querySelector('#hintPingBtn').onclick = () => pingDevice(d);
        hint.querySelector('#hintFileBtn').onclick = () => openPeerSendFile(d);
        setTimeout(() => { if (hint.parentNode) hint.remove(); }, 8000);
      }

      async function pingDevice(d) {
        try {
          const r = await invoke('localsend/ping', { ip: d.ip, port: d.port });
          d.pingMs = r.latencyMs;
          d.lastPingOk = r.success;
          renderDeviceList();
          if (!r.success) alert('设备不可达: ' + r.message);
        } catch (e) { alert('Ping 失败: ' + e.message); }
      }

      // 点对点直接发文件（不走频道，用 LocalSend 协议直连）
      function openPeerSendFile(d) {
        const picker = document.createElement('input');
        picker.type = 'file'; picker.multiple = true;
        picker.onchange = async (e) => {
          const files = Array.from(e.target.files);
          if (!files.length) return;
          const sources = files.map(f => f.name); // 前端还拿不到绝对路径，需走后端文件对话框
          alert(`已选 ${files.length} 个文件。由于 Web 沙箱限制，直接传文件需要后端文件对话框。\n替代方案：把文件加入频道 → 让对方进入频道下载。\n\n文件列表：\n${files.map(f => f.name).join('\n')}`);
        };
        picker.click();
      }

      async function refreshDevices(silent = false) {
        if (!state.running) {
          if (!silent) alert('请先点"启动"按钮启动服务，才能扫描局域网设备');
          return;
        }
        try {
          // discovery 后台持续跑着，scan 只做一次 devices 拉取；不再强制 sleep 2 秒
          const r = await invoke('localsend/devices');
          const known = state.devices;
          state.devices = (r.devices || []).map(d => {
            const prev = known.find(x => x.fingerprint === d.fingerprint);
            return { ...prev, ...d };
          });
          renderDeviceList();
        } catch (e) { if (!silent) console.error(e); }
      }

      async function joinMemberFromDevice(d) {
        await invoke('channel/join', {
          channelId: state.selectedChannel.id,
          name: d.name, ip: d.ip, memberId: d.fingerprint,
        });

        </div>`;
        document.body.appendChild(dragOverlay);

        document.addEventListener('dragenter', (e) => {
          if (!e.dataTransfer?.types?.includes('Files')) return;
          dragCounter++;
          dragOverlay.classList.add('active');
        });
        document.addEventListener('dragleave', (e) => {
          dragCounter--;
          if (dragCounter <= 0) { dragCounter = 0; dragOverlay.classList.remove('active'); }
        });
        document.addEventListener('dragover', (e) => {
          if (e.dataTransfer?.types?.includes('Files')) e.preventDefault();
        });
        document.addEventListener('drop', async (e) => {
          e.preventDefault(); dragCounter = 0;
          dragOverlay.classList.remove('active');

      async function sendMessage() {
        const input = $('#chatInput');
        const content = input.value.trim();

        input.value = '';
        await invoke('channel/message', {
          channelId: state.selectedChannel.id,

      function onFilePicked(e) {
        const files = Array.from(e.target.files);
        e.target.value = '';
        addFilesToChannel(files);
      }
      function onFolderPicked(e) {
        // webkitdirectory 里每个 file.webkitRelativePath 都带文件夹名前缀
        const files = Array.from(e.target.files);
        files.forEach(f => { f.__displayPath = f.webkitRelativePath || f.name; });
        e.target.value = '';
        addFilesToChannel(files);
      }
      function parseFileContent(content) {
        try {
          const j = JSON.parse(content);
          if (j && j.name) return j;
        } catch (_) {}
        return { name: String(content || '文件'), size: 0, fileId: '' };
      }
      function channelFileUrl(fileId) {
        const port = state.config?.port || 53317;
        const chId = state.selectedChannel?.id || '';
        return `http://127.0.0.1:${port}/api/channels/${chId}/files/${encodeURIComponent(fileId)}`;
      }
      function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => {
            const s = String(r.result || '');
            const comma = s.indexOf(',');
            resolve(comma >= 0 ? s.slice(comma + 1) : s);
          };
          r.onerror = () => reject(r.error || new Error('读取文件失败'));
          r.readAsDataURL(file);
        });
      }
      async function openChannelFile(fileId) {
        const ch = state.selectedChannel;
        if (!ch) return;
        try {
          await invoke('system/open-file', { channelId: ch.id, fileId: fileId || '' });
        } catch (e) {
          showToast('打开文件失败: ' + (e.message || e));
        }
      }
      async function openChannelFileFolder(fileId) {
        const ch = state.selectedChannel;
        if (!ch) return;
        try {
          await invoke('system/reveal-file', { channelId: ch.id, fileId: fileId || '' });
        } catch (e) {
          showToast('打开文件夹失败: ' + (e.message || e));
        }
      }
      async function downloadChannelFile(fileId, fileName) {
        if (!fileId) return;
        const ch = state.selectedChannel;
        if (!ch) return;
        try {
          const r = await invokeFile('channel/read-file', { channelId: ch.id, fileId });
          const raw = atob(r.data || '');
          const bytes = new Uint8Array(raw.length);
          for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
          const blob = new Blob([bytes], { type: r.mimeType || 'application/octet-stream' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = r.fileName || fileName || 'file';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 3000);
        } catch (e) {
          // 兜底：用系统浏览器打开 HTTP 下载地址
          try { await invoke('system/open-url', { url: channelFileUrl(fileId) }); }
          catch (_) { showToast('下载失败: ' + (e.message || e)); }
        }
      }
      async function addFilesToChannel(files) {
        const ch = state.selectedChannel;
        if (!ch || !files || !files.length) return;
        let ok = 0;
        for (const f of files) {
          const fid = (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '') : 'f' + Math.random().toString(36).slice(2, 10));
          try {
            // 走插件 RPC 传文件内容，避免 WebView 跨 origin 访问本机端口被拦
            const b64 = await readFileAsBase64(f);
            const r = await invokeFile('channel/upload-file', {
              channelId: ch.id,
              fileId: fid,
              fileName: f.name,
              mimeType: f.type || 'application/octet-stream',
              data: b64,
            });
            const fm = r.file || {};
            await invoke('channel/message', {
              channelId: ch.id,
              senderId: state.me.id,
              sender: state.me.name || state.config?.nickname || '我',
              content: JSON.stringify({ name: f.__displayPath || fm.fileName || f.name, size: fm.size || f.size || 0, fileId: fm.id || fid }),
              type: 'file',
            });
            ok++;
          } catch (e) {
            console.error('上传文件失败', f.name, e);
            showToast(`文件「${f.name}」发送失败: ${e.message || e}`);
          }
        }
        await refreshChannels();
        renderChatCenter();
        renderRightCol();
        if (ok > 0) showToast(`已发送 ${ok} 个文件`);
      }

          <div class="right-panel" style="max-height:25%; overflow-y:auto;">${memberRows || '<div class="empty-state" style="padding:20px 0;">暂无成员</div>'}</div>
          <div class="section-title">频道文件 · ${ch.files.length}</div>
          <div class="right-panel" style="max-height:30%; overflow-y:auto;">${fileRows || '<div class="empty-state" style="padding:20px 0;">聊天框📎按钮加文件</div>'}</div>
          <div class="section-title">传输记录 · ${state.transfers.length} <button id="refreshTransBtn" style="float:right; font-size:11px; padding:2px 8px; border-radius:8px; border:1px solid var(--border); background:transparent; cursor:pointer;">刷新</button></div>
          <div class="right-panel" style="flex:1; overflow-y:auto;">${renderTransferList()}</div>`;

        col.querySelectorAll('.f-openone').forEach(btn => {
          btn.addEventListener('click', () => openChannelFile(btn.dataset.fid));
        });
        col.querySelectorAll('.f-folder').forEach(btn => {
          btn.addEventListener('click', () => openChannelFileFolder(btn.dataset.fid));
        });
        col.querySelectorAll('.f-remove').forEach(btn => {
          btn.addEventListener('click', async () => {
            await invoke('channel/remove-file', { channelId: state.selectedChannel.id, fileId: btn.dataset.fid });
            await refreshChannels();
          });
        });
        const rtb = col.querySelector('#refreshTransBtn');
        if (rtb) rtb.addEventListener('click', async () => { await refreshTransfers(); renderRightCol(); });
      }

      function renderTransferList() {
        if (!state.transfers.length) return '<div class="empty-state" style="padding:20px 0;">还没有传输记录</div>';
        return state.transfers.map(t => {
          const dir = t.direction === 'sent' ? '📤' : '📥';
          const dirLabel = t.direction === 'sent' ? '发出' : '收到';
          let statusBadge = '';
          switch (t.status) {
            case 'success': statusBadge = '<span style="color:#22c55e;">✓ 成功</span>'; break;
            case 'decline': statusBadge = '<span style="color:#f59e0b;">✗ 拒绝</span>'; break;
            case 'failed': statusBadge = '<span style="color:#ef4444;">✗ 失败</span>'; break;
            case 'canceled': statusBadge = '<span style="color:#6b7280;">⏸ 取消</span>'; break;
            default: statusBadge = `<span>${t.status}</span>`;
          }
          const peer = t.peerName || t.peerIp || '未知';
          const fname = (t.files && t.files.length) ? t.files[0].fileName : '';
          const more = (t.files?.length || 0) > 1 ? ` 等 ${t.files.length} 个文件` : '';
          return `<div style="padding:6px 8px; border-bottom:1px solid var(--border); font-size:12px;">
            <div style="display:flex; align-items:center; gap:6px;">
              <span style="font-size:14px;">${dir}</span>
              <span style="font-weight:500;">${dirLabel} → ${escapeHtml(peer)}</span>
              <span style="flex:1;"></span>
              ${statusBadge}
            </div>
            <div style="color:var(--muted-fg); font-size:11px; margin-top:2px; padding-left:20px;">
              ${escapeHtml(fname)}${escapeHtml(more)} · ${humanSize(t.totalSize)} · ${fmtTime(t.startedAt)}
              ${t.durationMs ? ` · ${(t.durationMs/1000).toFixed(1)}s` : ''}
            </div>
            ${t.errorMsg ? `<div style="color:#ef4444; font-size:11px; padding-left:20px; margin-top:2px;">⚠ ${escapeHtml(t.errorMsg)}</div>` : ''}
          </div>`;
        }).join('');
      }

      // ========= 频道设置 Modal =========
      function openChSettings() {
        const ch = state.selectedChannel; if (!ch) return;
        const isLobby = ch.visibility === 'public';
        const root = $('#modalRoot'); root.style.display = 'flex'; root.innerHTML = `
          <div class="modal-backdrop">
            <div class="modal" style="width:420px;">
              <h3>频道设置 · ${escapeHtml(ch.name)}</h3>
              <div style="display:flex; flex-direction:column; gap:14px;">
                <div>
                  <div class="modal-row-label">频道名称</div>
                  <input type="text" id="chSetName" value="${escapeHtml(ch.name)}" style="width:100%; padding:8px 10px; background:var(--muted); border:none; border-radius:var(--radius); font-size:12px;">
                </div>
                <div>
                  <div class="modal-row-label">PIN 码（私有频道自动生成，公有频道留空即可）</div>
                  <input type="text" id="chSetPIN" value="${escapeHtml(ch.pin || '')}" maxlength="8" ${isLobby ? 'disabled' : ''} placeholder="${isLobby ? '公有频道无需 PIN' : '留空自动生成 6 位'}" style="width:100%; padding:8px 10px; background:var(--muted); border:none; border-radius:var(--radius); font-family:var(--mono); font-size:12px;">
                </div>
                <div>
                  <div class="modal-row-label">可见性</div>
                  <select id="chSetVis" ${isLobby ? 'disabled' : ''} style="width:100%; padding:8px 10px; background:var(--muted); border:none; border-radius:var(--radius); font-size:12px;">
                    <option value="public" ${ch.visibility==='public'?'selected':''}>🌐 公有（任何人可加入）</option>
                    <option value="private" ${ch.visibility==='private'?'selected':''}>🔒 私有（需链接+PIN）</option>
                  </select>
                  ${isLobby ? '<div style="font-size:11px; color:var(--muted-fg); margin-top:4px;">公有频道强制保持公有，不可切换</div>' : ''}
                </div>
                <div style="font-size:11px; color:var(--muted-fg);">
                  频道 ID · ${ch.id}<br>
                  成员 ${ch.members.length} · 文件 ${ch.files.length} · 端口 ${ch.port || '—'}
                </div>
              </div>
              <div class="modal-footer">
                <button id="cancelChSetBtn">取消</button>
                <button class="primary" id="saveChSetBtn">保存</button>
              </div>
            </div>
          </div>`;
        const close = () => { root.style.display = 'none'; root.innerHTML = ''; };
        root.querySelector('#cancelChSetBtn').addEventListener('click', close);
        root.querySelector('.modal-backdrop').addEventListener('click', (e) => { if (e.target.classList.contains('modal-backdrop')) close(); });
        root.querySelector('#saveChSetBtn').addEventListener('click', async () => {
          const patch = {
            id: ch.id,
            name: root.querySelector('#chSetName').value.trim(),
            pin: root.querySelector('#chSetPIN').value.trim(),
            visibility: root.querySelector('#chSetVis').value,
          };
          const res = await invoke('channel/update', patch);
          if (!res.success) { alert(res.message || '保存失败'); return; }
          close();
          await refreshChannels(); renderChatCenter(); renderRightCol();
        });
      }

      // ========= 分享 Modal =========
      async function showShare() {
        if (!state.running) { alert('请先点启动按钮，服务起来后才能生成分享地址'); return; }
        const data = await invoke('share/all-addresses');
        const root = $('#modalRoot'); root.style.display = 'flex';
        const channels = data.channels || [];
        const port = channels[0]?.port || 53317;

        // 收集所有可用 IP（去重）
        const ipSet = new Set();
        for (const ch of channels) for (const a of (ch.addresses || [])) if (a.type !== 'loopback') ipSet.add(a.ip);
        let ips = Array.from(ipSet);
        if (data.localIP) {
          ips = ips.filter(i => i !== data.localIP);
          ips.unshift(data.localIP);
        }

        const ICON = {
          open: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
          copy: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
          qr:   '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><line x1="14" y1="14" x2="17" y2="14"/><line x1="20" y1="14" x2="21" y2="14"/><line x1="14" y1="20" x2="15" y2="20"/><line x1="19" y1="20" x2="21" y2="20"/><line x1="14" y1="17" x2="14" y2="17"/></svg>',
          check:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        };
        const btnStyle = 'width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--card);color:var(--muted-fg);cursor:pointer;border-radius:9px;transition:all .15s;flex-shrink:0;';

        // 每行 http://IP:port  [浏览器打开] [复制] [二维码]
        let rows = '';
        for (const ip of ips) {
          const url = `http://${ip}:${port}`;
          const safeUrl = escapeHtml(url);
          rows += `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--muted);border-radius:9px;">
            <code style="flex:1;font-family:var(--mono);font-size:13px;color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${safeUrl}</code>
            <button class="icon-btn open-btn" data-url="${safeUrl}" title="浏览器打开" style="${btnStyle}" onmouseover="this.style.color='var(--primary)';this.style.borderColor='var(--primary)'" onmouseout="this.style.color='var(--muted-fg)';this.style.borderColor='var(--border)'">${ICON.open}</button>
            <button class="icon-btn copy-btn" data-url="${safeUrl}" title="复制" style="${btnStyle}" onmouseover="this.style.color='var(--primary)';this.style.borderColor='var(--primary)'" onmouseout="this.style.color='var(--muted-fg)';this.style.borderColor='var(--border)'">${ICON.copy}</button>
            <button class="icon-btn qr-btn" data-url="${safeUrl}" title="二维码" style="${btnStyle}" onmouseover="this.style.color='var(--primary)';this.style.borderColor='var(--primary)'" onmouseout="this.style.color='var(--muted-fg)';this.style.borderColor='var(--border)'">${ICON.qr}</button>
          </div>`;
        }

        let html = `
          <div class="modal-backdrop">
            <div class="modal" style="width:min(580px, 94vw); max-height:80vh; display:flex; flex-direction:column; padding:0;">
              <div style="padding:16px 18px 10px; border-bottom:1px solid var(--border); flex:none;">
                <div style="font-size:14px; font-weight:600; margin-bottom:4px;">🖥️ 分享链接</div>
                <div style="font-size:11.5px; color:var(--muted-fg);">所有频道共享端口 ${port}，手机/其他电脑访问任意地址即可进入频道列表</div>
              </div>
              <div id="shareBody" style="flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:8px;">${rows || '<div class="empty" style="padding:24px 0;">没检测到可用网卡 IP</div>'}</div>
              <div style="padding:10px 18px; border-top:1px solid var(--border); flex:none; display:flex; justify-content:flex-end;">
                <button id="closeShareModal" class="primary" style="padding:6px 16px;">关闭</button>
              </div>
            </div>
          </div>`;
        root.innerHTML = html;

        // 绑定事件
        root.querySelector('#closeShareModal').onclick = () => { root.style.display = 'none'; };
        root.querySelectorAll('.copy-btn').forEach(btn => {
          btn.onclick = async () => {
            const url = btn.dataset.url;
            await navigator.clipboard.writeText(url);
            const old = btn.innerHTML; btn.innerHTML = ICON.check; btn.style.color = 'var(--success)';
            setTimeout(() => { btn.innerHTML = old; btn.style.color = ''; }, 1200);
          };
        });
        root.querySelectorAll('.qr-btn').forEach(btn => {
          btn.onclick = () => { openQRModal(btn.dataset.url); };
        });
        root.querySelectorAll('.open-btn').forEach(btn => {
          btn.onclick = async () => {
            const url = btn.dataset.url;
            try { await invoke('system/open-url', { url }); }
            catch (e) {
              const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.click();
            }
          };
        });

        // 全局二维码 modal
        let qrModal = null;
        function openQRModal(url) {
          closeQRModal();
          qrModal = document.createElement('div');
          qrModal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
          qrModal.innerHTML = `<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;text-align:center;min-width:240px;">
            <div style="font-size:13px;font-weight:600;margin-bottom:12px;">扫码访问</div>
            <div id="qrCanvasWrap" style="background:#fff;padding:14px;border-radius:10px;display:inline-block;margin-bottom:12px;"></div>
            <div style="font-family:var(--mono);font-size:11px;color:var(--muted-fg);word-break:break-all;margin-bottom:14px;">${escapeHtml(url)}</div>
            <div style="display:flex;gap:8px;justify-content:center;">
              <button id="qrOpenBtn" style="padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--muted);cursor:pointer;font-size:12.5px;">浏览器打开</button>
              <button id="qrCloseBtn" class="primary" style="padding:6px 16px;border-radius:8px;font-size:12.5px;">关闭</button>
            </div>
          </div>`;
          document.body.appendChild(qrModal);
          // 生成二维码（vendor 里是 qrcodejs 库，暴露构造函数 QRCode，而不是 QRCode.toCanvas）
          setTimeout(() => {
            const wrap = qrModal.querySelector('#qrCanvasWrap');
            if (!wrap) return;
            wrap.innerHTML = '';
            if (typeof QRCode === 'undefined') {
              wrap.innerHTML = '<div style="color:#71717a;font-size:12px;padding:20px;">二维码库加载失败</div>';
              return;
            }
            try {
              new QRCode(wrap, { text: url, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
            } catch (e) {
              wrap.innerHTML = '<div style="color:#71717a;font-size:12px;padding:20px;">生成二维码失败</div>';
              console.error('二维码生成失败', e);
            }
          }, 30);
          qrModal.onclick = (e) => { if (e.target === qrModal) closeQRModal(); };
          qrModal.querySelector('#qrCloseBtn').onclick = closeQRModal;
          qrModal.querySelector('#qrOpenBtn').onclick = async () => {
            try { await invoke('system/open-url', { url }); }
            catch (e) { const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.click(); }
          };
        }
        function closeQRModal() { if (qrModal) { document.body.removeChild(qrModal); qrModal = null; } }
      }

      // ========= 工具 =========
      function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
      }

      // ========= Tabs =========
      document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.querySelector(`.tab-panel[data-panel="${tab.dataset.tab}"]`).classList.add('active');
        if (tab.dataset.tab === 'settings') refreshInterfaces();
      }));

      // ========= 事件 =========
      $('#cfgSaveOnlyBtn').addEventListener('click', async () => { const r = await saveConfigOnly(); alert(r.success ? '已保存' : '保存失败: ' + r.message); });
      $('#cfgApplyBtn').addEventListener('click', () => startService(true));
      $('#cfgStartBtn').addEventListener('click', () => startService(false));
      $('#cfgStopBtn').addEventListener('click', stopService);
      $('#refreshIfBtn').addEventListener('click', refreshInterfaces);
      $('#pickFolderBtn').addEventListener('click', async () => {
        try {
          const r = await invoke('folder/pick');
          if (r.cancelled) { return; }
          if (r.path) { $('#cfgSaveDir').value = r.path; }
        } catch (e) {
          alert('选择目录失败（仅 Windows 支持）: ' + (e.message||e));
        }
      });
      $('#refreshDevicesBtn').addEventListener('click', refreshDevices);
      $('#topShareBtn').addEventListener('click', showShare);
      $('#createChBtn').addEventListener('click', createChannel);
      $('#randomPINBtn').addEventListener('click', () => {
        const b = new Uint8Array(3); crypto.getRandomValues(b);
        $('#newChannelPIN').value = String((b[0] << 16) | (b[1] << 8) | b[2]).padStart(6, '0').slice(0, 6);
      });
      $('#cfgAutoStart').addEventListener('click', () => toggleSwitch($('#cfgAutoStart'), !$('#cfgAutoStart').classList.contains('on')));

      // ========= init =========
      async function init() {
        state.context = await bridge.ready;
        // 先绑定 emitter 事件（让后端推送的设备上下线能实时到前端）
        try { bindEmitterEvents(); } catch (e) { console.error('bindEmitterEvents', e); }
        // 拖放文件到频道
        try { setupDragDrop(); } catch (e) { console.error('setupDragDrop', e); }
        // 频道列表优先加载，且不被其它请求失败阻断
        try { await refreshChannels(); } catch (e) { console.error('refreshChannels', e); }
        // 配置/状态/网卡各自独立，互不影响
        await Promise.allSettled([loadConfig(), refreshInterfaces(), refreshStatus()]);
        // 状态就绪后补刷一次频道（确保身份/选中态已就绪）
        try { await refreshChannels(); } catch (e) { console.error('refreshChannels#2', e); }
        try { await refreshDevices(); } catch (e) { console.error('refreshDevices', e); }
        try { await refreshTransfers(); } catch (e) { console.error('refreshTransfers', e); }
        // 消息轮询（频道内消息仍每 3 秒刷新一次）
        setInterval(async () => {
          if (state.selectedChannel) {
            try { await refreshChannels(); } catch(e){}
          }
        }, 3000);
        // 状态轮询：后端进程可能被宿主重启，定期同步"运行中"状态
        setInterval(async () => { try { await refreshStatus(); } catch(e){} }, 5000);
      }
      init().catch(e => console.error('init', e));
    </script>
  </body>
</html>
