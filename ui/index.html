<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>邻间 · 局域网通讯</title>
<link rel="stylesheet" href="im.css">
<script defer src="vendor/qrcode.min.js"></script>
<script defer src="im-archive.js"></script>
<script defer src="im.js">
</script>
</head>
<body>
<div id="app">
<nav class="rail">
<div class="logo brand-icon" title="邻间"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0F766E"/>

  <!-- 文件主体 -->
  <path d="M22 18h10l8 8v20a2 2 0 0 1-2 2H22a2 2 0 0 1-2-2V20a2 2 0 0 1 2-2z" fill="#FFFFFF"/>
  <path d="M32 18v8h8" stroke="#0F766E" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path d="M26 30h12M26 36h8" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/>

  <!-- 局域网 Wi-Fi 信号：右上 45° 扇形 -->
  <circle cx="44" cy="24" r="1.6" fill="#FFFFFF"/>
  <path d="M41 21a4 4 0 0 1 6 0" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M38 18a8 8 0 0 1 12 0" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg></div>
<button id="navChats" class="rail-button active" title="会话">☷</button>
<button id="contacts" class="rail-button" title="通讯录" aria-label="通讯录"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="15" height="18" rx="3"/><path d="M3 7h4M3 12h4M3 17h4"/><circle cx="12.5" cy="9" r="2.5"/><path d="M9 17v-1a3.5 3.5 0 0 1 7 0v1"/></svg></button>
<button id="nodes" class="rail-button" title="可信节点">⌘</button>
<div class="grow">
</div>
<button id="share" class="rail-button" title="邀请朋友">↗</button>
<button id="settings" class="rail-button" title="设置">⚙</button>
<button id="profile" class="avatar" title="我的资料">我</button>
</nav>
<aside class="sidebar">
<header>
<div>
<span class="eyebrow">LAN WORKSPACE</span>
<h1>消息</h1>
</div>
<button id="newChat" class="icon" title="新建群聊">＋</button>
</header>
<div class="search-wrap">
<input id="conversationSearch" type="search" placeholder="搜索会话" aria-label="搜索会话">
</div>
<div class="section-label">最近会话 <span id="conversationCount">0</span>
</div>
<div id="conversations" class="conversation-list">
</div>
<footer>
<span id="connection" class="connection">正在连接…</span>
<span class="muted">邻间 0.1.3</span>
</footer>
</aside>
<main id="main">
<div id="empty" class="empty">
<div class="empty-mark brand-icon" aria-label="邻间"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0F766E"/>

  <!-- 文件主体 -->
  <path d="M22 18h10l8 8v20a2 2 0 0 1-2 2H22a2 2 0 0 1-2-2V20a2 2 0 0 1 2-2z" fill="#FFFFFF"/>
  <path d="M32 18v8h8" stroke="#0F766E" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path d="M26 30h12M26 36h8" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/>

  <!-- 局域网 Wi-Fi 信号：右上 45° 扇形 -->
  <circle cx="44" cy="24" r="1.6" fill="#FFFFFF"/>
  <path d="M41 21a4 4 0 0 1 6 0" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M38 18a8 8 0 0 1 12 0" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg></div>
<h2>近在身边，随时沟通</h2>
<p>从通讯录开始一段对话，<br>让消息和文件在局域网内自由流动。</p>
<button id="startChat" class="primary">打开通讯录</button>
<small>邻间 · 局域网协作空间</small>
</div>
<section id="chat" hidden>
<header class="chat-header">
<button id="back" class="icon mobile" aria-label="返回会话">‹</button>
<div class="avatar" id="chatAvatar">聊</div>
<div class="grow">
<h2 id="chatTitle">
</h2>
<span id="chatSubtitle" class="muted">
</span>
</div>
<input id="messageSearch" type="search" placeholder="搜索聊天记录" aria-label="搜索聊天记录">
<button id="chatFiles" class="icon file-history-icon" type="button" title="当前会话文件" aria-label="当前会话文件"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4zM3 4h18v3H3zM8 11h8M8 15h5"/></svg></button>
</header>
<div id="searchNotice" hidden class="notice">
</div>
<div id="messages" class="messages" role="log" aria-live="polite">
</div>
<div id="transfer" hidden class="transfer">
<span>
</span>
<progress max="100" value="0">
</progress>
<button class="text" id="cancelUpload">暂停</button>
</div>
<form id="composer" class="composer">
<div class="composer-tools">
<button type="button" id="attach" class="text" title="发送文件或图片">＋ 文件 / 图片</button>
<button type="button" id="emoji" class="text" title="表情">☺ 表情</button>
<button type="button" id="attachFolder" class="text" title="发送文件夹">▣ 文件夹</button>
<button type="button" id="transferTasks" class="text">传输任务</button>
<span class="muted">Enter 发送 · Shift + Enter 换行</span>
</div>
<textarea id="draft" rows="3" placeholder="发送消息，让协作发生…" aria-label="消息内容">
</textarea>
<div class="composer-bottom">
<span id="composerHint" class="muted">消息仅在当前协作空间内可见</span>
<button id="send" class="primary" type="submit">发送 ↗</button>
</div>
</form>
</section>
</main>
</div>
<dialog id="modal">
<div id="modalContent">
</div>
</dialog>
<div id="toast" role="status" popover="manual" hidden>
</div>
<span id="backAuth" hidden></span>
<input id="fileInput" type="file" hidden>
<input id="folderInput" type="file" webkitdirectory multiple hidden>
<input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
</body>
</html>
